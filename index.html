<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.1">
  <title>منصوبے | Projects </title>
   <!-- جب دوبارہ کوئی نیا چینج کریں تو v=1 کو v=2 کر دیں -->
   <link rel="stylesheet" href="style.css?v=1.1">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f7f4eb;
      --text-green: #213829;
      --text-gold: #b28d46;
      --card-bg: #ffffff;
      --border-color: #e4dfd3;
      --danger-red: #9e2a2b;
      --edit-blue: #2b5c8f;
      --hide-gray: #6c757d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.25s ease;
    }

    body {
      background-color: var(--bg-color);
      color: #333;
      font-family: 'Noto Nastaliq Urdu', serif;
      padding: 20px 15px;
    }

    /* Top Navigation Bar */
    .top-nav {
      max-width: 900px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
      color: #ffffff;
    }

    .btn-home { background-color: var(--text-green); }
    .btn-add { background-color: var(--text-gold); }
    .btn-settings { background-color: var(--text-green); }
    .btn-logout { background-color: var(--danger-red); }

    .nav-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .admin-controls-bar {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header-title-ur {
      color: var(--text-green);
      font-size: 1.7rem;
      font-weight: bold;
      line-height: 1.6;
    }

    .header-title-en {
      color: var(--text-gold);
      font-size: 1rem;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 2px;
      display: block;
      margin-top: -2px;
    }

    .header-sub {
      color: #555;
      font-size: 0.9rem;
      margin-top: 6px;
      line-height: 1.6;
    }

    /* Main Grid & Cards Layout */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .project-card.hidden-project {
      opacity: 0.55;
      border-style: dashed;
    }

    .project-card:hover {
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      border-color: var(--text-gold);
    }

    .project-link {
      text-decoration: none;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .project-card img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .project-title-ur {
      font-size: 1.2rem;
      color: var(--text-green);
      line-height: 1.8;
      font-weight: bold;
    }

    .project-title-en {
      font-size: 0.8rem;
      color: var(--text-gold);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* Icon-Only Admin Action Buttons */
    .card-admin-actions {
      display: none;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
      width: 100%;
      justify-content: center;
      gap: 8px;
    }

    .action-icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 1.05rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .action-icon-btn:hover {
      transform: scale(1.1);
    }

    .btn-edit { background-color: var(--edit-blue); }
    .btn-hide { background-color: var(--hide-gray); }
    .btn-delete { background-color: var(--danger-red); }

    /* Modal System Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 25px 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      position: relative;
    }

    .modal-content h3 {
      color: var(--text-green);
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-green);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-color);
      font-family: inherit;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-full {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      color: #fff;
      font-weight: bold;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      left: 18px;
      font-size: 1.4rem;
      cursor: pointer;
      color: #888;
    }

    .error-msg {
      color: var(--danger-red);
      font-size: 0.85rem;
      margin-bottom: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="https://attaurrehman-atta.blogspot.com" class="nav-btn btn-home">
      صفحہ اول (Home)
    </a>

    <div class="admin-controls-bar" id="adminBar">
      <button class="nav-btn btn-add" id="openAddModalBtn">+ پروجیکٹ اپلوڈ کریں</button>
      <button class="nav-btn btn-settings" id="openCredModalBtn">⚙ سیٹنگز</button>
      <button class="nav-btn btn-logout" id="logoutBtn">لاگ آؤٹ</button>
    </div>
  </nav>

  <header>
    <h1 class="header-title-ur">منصوبے | PROJECTS </h1>
    <p class="header-sub">ان پروجیکٹس میں براہوئی زبان کی خاطر آپ کے بھر پور تعاون کی ضرورت ہے</p>
  </header>

  <main class="projects-grid" id="projectsContainer"></main>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModals()">&times;</span>
      <h3>ایڈمن لاگ ان</h3>
      <div id="loginError" class="error-msg">غلط یوزر نیم یا پاس ورڈ!</div>
      <form id="loginForm">
        <div class="form-group">
          <label>یوزر نیم (Username):</label>
          <input type="text" id="loginUser" style="direction: ltr;" required>
        </div>
        <div class="form-group">
          <label>پاس ورڈ (Password):</label>
          <input type="password" id="loginPass" style="direction: ltr;" required>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-full btn-home">لاگ ان کریں</button>
          <button type="button" class="btn-full btn-logout" onclick="closeModals()">منسوخ</button>
        </div>
      </form>
    </div>
  </div>

  <div id="projectModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModals()">&times;</span>
      <h3 id="modalProjectTitle">نیا پروجیکٹ شامل کریں</h3>
      <form id="projectForm">
        <input type="hidden" id="editProjId">
        <div class="form-group">
          <label>پروجیکٹ کا نام (اردو):</label>
          <input type="text" id="projUrName" required placeholder="مثال: براہوئی ڈکشنری">
        </div>
        <div class="form-group">
          <label>پروجیکٹ کا نام (انگلش):</label>
          <input type="text" id="projEnName" style="direction: ltr;" required placeholder="e.g. BRAHUI DICTIONARY">
        </div>
        <div class="form-group">
          <label>آئکن / فوٹو کا لنک (Image URL):</label>
          <input type="url" id="projIcon" style="direction: ltr;" required placeholder="https://example.com/icon.png">
        </div>
        <div class="form-group">
          <label>پروجیکٹ ویب سائٹ کا لنک (Project URL):</label>
          <input type="url" id="projLink" style="direction: ltr;" required placeholder="https://your-project-link.com">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-full btn-add">محفوظ کریں</button>
          <button type="button" class="btn-full btn-logout" onclick="closeModals()">منسوخ</button>
        </div>
      </form>
    </div>
  </div>

  <div id="credModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModals()">&times;</span>
      <h3>کریڈینشلز تبدیل کریں</h3>
      <form id="credForm">
        <div class="form-group">
          <label>نیا یوزر نیم (New Username):</label>
          <input type="text" id="newUsername" style="direction: ltr;" required>
        </div>
        <div class="form-group">
          <label>نیا پاس ورڈ (New Password):</label>
          <input type="password" id="newPassword" style="direction: ltr;" required>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-full btn-settings">اپڈیٹ کریں</button>
          <button type="button" class="btn-full btn-logout" onclick="closeModals()">منسوخ</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const container = document.getElementById('projectsContainer');
    const adminBar = document.getElementById('adminBar');

    const defaultProjects = [
      {
        id: 'def-1',
        urName: 'براہوئی ٹرانسلیٹر',
        enName: 'BRAHUI TRANSLATOR',
        icon: 'https://cdn-icons-png.flaticon.com/512/3898/3898082.png',
        link: 'https://example.com/translator',
        hidden: false
      },
      {
        id: 'def-2',
        urName: 'براہوئی ذخیرہ الفاظ',
        enName: 'BRAHUI VOCABULARY',
        icon: 'https://cdn-icons-png.flaticon.com/512/2232/2232688.png',
        link: 'https://example.com/vocabulary',
        hidden: false
      }
    ];

    if (!localStorage.getItem('adminUser')) localStorage.setItem('adminUser', 'atta');
    if (!localStorage.getItem('adminPass')) localStorage.setItem('adminPass', '1234');
    if (!localStorage.getItem('myProjects')) {
      localStorage.setItem('myProjects', JSON.stringify(defaultProjects));
    }

    let savedProjects = JSON.parse(localStorage.getItem('myProjects')) || defaultProjects;

    function checkAdminState() {
      const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
      adminBar.style.display = isLoggedIn ? 'flex' : 'none';
      
      document.querySelectorAll('.card-admin-actions').forEach(el => {
        el.style.display = isLoggedIn ? 'flex' : 'none';
      });

      renderProjects();
    }

    function checkHash() {
      if (window.location.hash === '#admin') {
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
          checkAdminState();
        } else {
          document.getElementById('loginModal').style.display = 'flex';
        }
      } else {
        closeModals();
      }
    }

    window.addEventListener('load', () => {
      renderProjects();
      checkHash();
      checkAdminState();
    });
    window.addEventListener('hashchange', checkHash);

    function closeModals() {
      document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
      if (window.location.hash === '#admin' && sessionStorage.getItem('isLoggedIn') !== 'true') {
        history.pushState("", document.title, window.location.pathname + window.location.search);
      }
    }

    // Login Form
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('loginUser').value;
      const p = document.getElementById('loginPass').value;

      if (u === localStorage.getItem('adminUser') && p === localStorage.getItem('adminPass')) {
        sessionStorage.setItem('isLoggedIn', 'true');
        document.getElementById('loginError').style.display = 'none';
        this.reset();
        closeModals();
        checkAdminState();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    });

    // Logout
    document.getElementById('logoutBtn').onclick = () => {
      sessionStorage.removeItem('isLoggedIn');
      checkAdminState();
      history.pushState("", document.title, window.location.pathname + window.location.search);
    };

    // Open Modals
    document.getElementById('openAddModalBtn').onclick = () => {
      document.getElementById('projectForm').reset();
      document.getElementById('editProjId').value = '';
      document.getElementById('modalProjectTitle').innerText = 'نیا پروجیکٹ شامل کریں';
      document.getElementById('projectModal').style.display = 'flex';
    };

    document.getElementById('openCredModalBtn').onclick = () => {
      document.getElementById('credModal').style.display = 'flex';
    };

    // Change Credentials
    document.getElementById('credForm').addEventListener('submit', function(e) {
      e.preventDefault();
      localStorage.setItem('adminUser', document.getElementById('newUsername').value);
      localStorage.setItem('adminPass', document.getElementById('newPassword').value);
      alert('یوزر نیم اور پاس ورڈ تبدیل کر دیا گیا ہے!');
      this.reset();
      closeModals();
    });

    // Add / Edit Project Submit
    document.getElementById('projectForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const editId = document.getElementById('editProjId').value;
      const urName = document.getElementById('projUrName').value;
      const enName = document.getElementById('projEnName').value;
      const icon = document.getElementById('projIcon').value;
      const link = document.getElementById('projLink').value;

      if (editId) {
        savedProjects = savedProjects.map(p => p.id == editId ? { ...p, urName, enName, icon, link } : p);
      } else {
        const newProj = { id: Date.now(), urName, enName, icon, link, hidden: false };
        savedProjects.push(newProj);
      }

      localStorage.setItem('myProjects', JSON.stringify(savedProjects));
      renderProjects();
      closeModals();
    });

    // Render Projects List
    function renderProjects() {
      container.innerHTML = '';
      const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';

      savedProjects.forEach(proj => {
        // If hidden and user is not admin, don't show to general public
        if (proj.hidden && !isLoggedIn) return;

        const card = document.createElement('div');
        card.className = `project-card ${proj.hidden ? 'hidden-project' : ''}`;

        const hideIcon = proj.hidden ? '🙈' : '👁️';
        const hideTitle = proj.hidden ? 'Show' : 'Hide';

        card.innerHTML = `
          <a href="${proj.link}" target="_blank" class="project-link">
            <img src="${proj.icon}" alt="${proj.enName}">
            <div class="project-title-ur">${proj.urName}</div>
            <div class="project-title-en">${proj.enName}</div>
          </a>
          <div class="card-admin-actions" style="display: ${isLoggedIn ? 'flex' : 'none'};">
            <button class="action-icon-btn btn-edit" onclick="editProject('${proj.id}')" title="Edit">✏️</button>
            <button class="action-icon-btn btn-hide" onclick="toggleHideProject('${proj.id}')" title="${hideTitle}">${hideIcon}</button>
            <button class="action-icon-btn btn-delete" onclick="deleteProject('${proj.id}')" title="Delete">🗑️</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Toggle Hide/Show Action
    window.toggleHideProject = function(id) {
      savedProjects = savedProjects.map(p => p.id == id ? { ...p, hidden: !p.hidden } : p);
      localStorage.setItem('myProjects', JSON.stringify(savedProjects));
      renderProjects();
    };

    // Delete Action
    window.deleteProject = function(id) {
      if (confirm('کیا آپ واقعی اس پروجیکٹ کو ڈیلیٹ کرنا چاہتے ہیں؟')) {
        savedProjects = savedProjects.filter(p => p.id != id);
        localStorage.setItem('myProjects', JSON.stringify(savedProjects));
        renderProjects();
      }
    };

    // Edit Action
    window.editProject = function(id) {
      const proj = savedProjects.find(p => p.id == id);
      if (proj) {
        document.getElementById('editProjId').value = proj.id;
        document.getElementById('projUrName').value = proj.urName;
        document.getElementById('projEnName').value = proj.enName;
        document.getElementById('projIcon').value = proj.icon;
        document.getElementById('projLink').value = proj.link;
        
        document.getElementById('modalProjectTitle').innerText = 'پروجیکٹ ایڈٹ کریں';
        document.getElementById('projectModal').style.display = 'flex';
      }
    };
  </script>
</body>
</html>
