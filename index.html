<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* تصاویر والے بلاگ کا تھیم کلر */
      --bg-color: #f7f4eb;
      --text-green: #213829;
      --text-gold: #b28d46;
      --card-bg: #ffffff;
      --border-color: #e4dfd3;
      --danger-red: #8b0000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.3s ease;
    }

    body {
      background-color: var(--bg-color);
      color: #333;
      font-family: 'Noto Nastaliq Urdu', serif;
      padding: 30px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    /* منصوبے / Projects سرخی */
    .header-title-ur {
      color: var(--text-green);
      font-size: 2.2rem;
      font-weight: bold;
      line-height: 1.8;
      display: block;
    }

    .header-title-en {
      color: var(--text-gold);
      font-size: 1.5rem;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 2px;
      display: block;
      margin-top: -5px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      border-color: var(--text-gold);
    }

    .project-card img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      margin-bottom: 18px;
    }

    .project-title-ur {
      font-size: 1.25rem;
      color: var(--text-green);
      line-height: 1.8;
      font-weight: bold;
      display: block;
    }

    .project-title-en {
      font-size: 0.95rem;
      color: var(--text-gold);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 1px;
      display: block;
      margin-top: 2px;
    }

    /* Modal System */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      position: relative;
    }

    .modal-content h3 {
      color: var(--text-green);
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-green);
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-color);
      font-family: inherit;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .btn-primary {
      background-color: var(--text-green);
      color: #fff;
    }

    .btn-secondary {
      background-color: var(--text-gold);
      color: #fff;
    }

    .btn-danger {
      background-color: var(--danger-red);
      color: #fff;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 1.4rem;
      cursor: pointer;
      color: #888;
    }

    .error-msg {
      color: var(--danger-red);
      font-size: 0.85rem;
      margin-bottom: 10px;
      text-align: center;
      display: none;
    }

    .admin-view {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="header-title-ur">منصوبے</h1>
    <span class="header-title-en">PROJECTS</span>
  </header>

  <main class="projects-grid" id="projectsContainer">
    <a href="https://example.com/translator" target="_blank" class="project-card">
      <img src="https://cdn-icons-png.flaticon.com/512/3898/3898082.png" alt="Brahui Translator">
      <div class="project-title-ur">براہوئی ٹرانسلیٹر</div>
      <div class="project-title-en">Brahui Translator</div>
    </a>

    <a href="https://example.com/vocabulary" target="_blank" class="project-card">
      <img src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" alt="Brahui Vocabulary">
      <div class="project-title-ur">براہوئی ذخیرہ الفاظ</div>
      <div class="project-title-en">Brahui Vocabulary</div>
    </a>
  </main>

  <div id="adminModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>

      <div id="loginView">
        <h3>ایڈمن لاگ ان (Admin Login)</h3>
        
        <div id="loginError" class="error-msg">غلط یوزر نیم یا پاس ورڈ! / Invalid Credentials!</div>

        <form id="loginForm">
          <div class="form-group">
            <label>یوزر نیم (Username):</label>
            <input type="text" id="loginUser" style="direction: ltr;" required>
          </div>
          <div class="form-group">
            <label>پاس ورڈ (Password):</label>
            <input type="password" id="loginPass" style="direction: ltr;" required>
          </div>
          <button type="submit" class="btn btn-primary">لاگ ان کریں (Login)</button>
        </form>
      </div>

      <div id="dashboardView" class="admin-view">
        <h3>ایڈمن کنٹرول پینل</h3>

        <button class="btn btn-primary" id="showAddProjectBtn">نیا پروجیکٹ شامل کریں (Add Project)</button>
        <button class="btn btn-secondary" id="showCredentialsBtn">یوزر نیم / پاس ورڈ تبدیل کریں (Change Auth)</button>
        <button class="btn btn-danger" id="logoutBtn">لاگ آؤٹ (Logout)</button>
      </div>

      <div id="addProjectView" class="admin-view">
        <h3>نیا پروجیکٹ شامل کریں</h3>

        <form id="addProjectForm">
          <div class="form-group">
            <label>پروجیکٹ کا نام (اردو):</label>
            <input type="text" id="projUrName" required placeholder="مثال: براہوئی ڈکشنری">
          </div>
          <div class="form-group">
            <label>پروجیکٹ کا نام (انگلش):</label>
            <input type="text" id="projEnName" style="direction: ltr;" required placeholder="e.g. Brahui Dictionary">
          </div>
          <div class="form-group">
            <label>آئکن / فوٹو کا لنک (Image URL):</label>
            <input type="url" id="projIcon" style="direction: ltr;" required placeholder="https://example.com/icon.png">
          </div>
          <div class="form-group">
            <label>پروجیکٹ ویب سائٹ کا لنک (Project URL):</label>
            <input type="url" id="projLink" style="direction: ltr;" required placeholder="https://your-project-link.com">
          </div>

          <button type="submit" class="btn btn-primary">محفوظ کریں (Save)</button>
          <button type="button" class="btn btn-secondary" id="backToDashFromAdd">واپس ڈیش بورڈ (Back)</button>
        </form>
      </div>

      <div id="credentialsView" class="admin-view">
        <h3>کریڈینشلز تبدیل کریں</h3>

        <form id="changeCredentialsForm">
          <div class="form-group">
            <label>نیا یوزر نیم (New Username):</label>
            <input type="text" id="newUsername" style="direction: ltr;" required>
          </div>
          <div class="form-group">
            <label>نیا پاس ورڈ (New Password):</label>
            <input type="password" id="newPassword" style="direction: ltr;" required>
          </div>

          <button type="submit" class="btn btn-primary">اپڈیٹ کریں (Update)</button>
          <button type="button" class="btn btn-secondary" id="backToDashFromCred">واپس ڈیش بورڈ (Back)</button>
        </form>
      </div>

    </div>
  </div>

  <script>
    const modal = document.getElementById('adminModal');
    const closeModal = document.getElementById('closeModal');
    const container = document.getElementById('projectsContainer');

    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const addProjectView = document.getElementById('addProjectView');
    const credentialsView = document.getElementById('credentialsView');
    const loginError = document.getElementById('loginError');

    // Default Credentials Setup
    if (!localStorage.getItem('adminUser')) localStorage.setItem('adminUser', 'admin');
    if (!localStorage.getItem('adminPass')) localStorage.setItem('adminPass', '12345');

    function showAdminView(viewName) {
      loginView.style.display = 'none';
      dashboardView.style.display = 'none';
      addProjectView.style.display = 'none';
      credentialsView.style.display = 'none';

      if (viewName === 'login') loginView.style.display = 'block';
      if (viewName === 'dashboard') dashboardView.style.display = 'block';
      if (viewName === 'add') addProjectView.style.display = 'block';
      if (viewName === 'credentials') credentialsView.style.display = 'block';
    }

    function checkHash() {
      if (window.location.hash === '#admin') {
        modal.style.display = 'flex';
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
          showAdminView('dashboard');
        } else {
          showAdminView('login');
        }
      } else {
        modal.style.display = 'none';
      }
    }
    window.addEventListener('load', checkHash);
    window.addEventListener('hashchange', checkHash);

    closeModal.onclick = function() {
      modal.style.display = 'none';
      history.pushState("", document.title, window.location.pathname + window.location.search);
    };

    // 1. Handle Login
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('loginUser').value;
      const p = document.getElementById('loginPass').value;

      if (u === localStorage.getItem('adminUser') && p === localStorage.getItem('adminPass')) {
        sessionStorage.setItem('isLoggedIn', 'true');
        loginError.style.display = 'none';
        this.reset();
        showAdminView('dashboard');
      } else {
        loginError.style.display = 'block';
      }
    });

    // 2. Dashboard Navigation Buttons
    document.getElementById('showAddProjectBtn').onclick = () => showAdminView('add');
    document.getElementById('showCredentialsBtn').onclick = () => showAdminView('credentials');
    document.getElementById('backToDashFromAdd').onclick = () => showAdminView('dashboard');
    document.getElementById('backToDashFromCred').onclick = () => showAdminView('dashboard');

    document.getElementById('logoutBtn').onclick = () => {
      sessionStorage.removeItem('isLoggedIn');
      showAdminView('login');
      modal.style.display = 'none';
      history.pushState("", document.title, window.location.pathname + window.location.search);
    };

    // 3. Handle Credentials Change
    document.getElementById('changeCredentialsForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const newU = document.getElementById('newUsername').value;
      const newP = document.getElementById('newPassword').value;

      localStorage.setItem('adminUser', newU);
      localStorage.setItem('adminPass', newP);

      alert('یوزر نیم اور پاس ورڈ کامیابی سے تبدیل ہو گیا ہے!');
      this.reset();
      showAdminView('dashboard');
    });

    // 4. Handle Add Project Form
    document.getElementById('addProjectForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const urName = document.getElementById('projUrName').value;
      const enName = document.getElementById('projEnName').value;
      const icon = document.getElementById('projIcon').value;
      const link = document.getElementById('projLink').value;

      const savedProjects = JSON.parse(localStorage.getItem('myProjects')) || [];
      savedProjects.push({ urName, enName, icon, link });
      localStorage.setItem('myProjects', JSON.stringify(savedProjects));

      appendProjectToDOM(urName, enName, icon, link);

      this.reset();
      showAdminView('dashboard');
    });

    // 5. Load Projects Logic
    function loadSavedProjects() {
      const savedProjects = JSON.parse(localStorage.getItem('myProjects')) || [];
      savedProjects.forEach(proj => {
        appendProjectToDOM(proj.urName, proj.enName, proj.icon, proj.link);
      });
    }

    function appendProjectToDOM(urName, enName, icon, link) {
      const card = document.createElement('a');
      card.href = link;
      card.target = '_blank';
      card.className = 'project-card';

      card.innerHTML = `
        <img src="${icon}" alt="${enName || urName}">
        <div class="project-title-ur">${urName}</div>
        <div class="project-title-en">${enName || urName}</div>
      `;
      container.appendChild(card);
    }

    loadSavedProjects();
  </script>
</body>
</html>
